<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Лёгкий Блокнот Pro Max</title>

    <!-- PWA / iOS -->
    <meta name="theme-color" content="#e9ecf1">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Блокнот">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-touch-fullscreen" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="shortcut icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #e9ecf1;
            --sheet: #ffffff;
            --tint: #f2f4f7;
            --line: rgba(20, 28, 45, .10);
            --ink: #171b25;
            --muted: #697184;
            --accent: #0e7c72;
            --accent-ink: #ffffff;
            --accent-soft: rgba(14, 124, 114, .13);
            --lift: 0 1px 2px rgba(20,28,45,.05), 0 12px 32px -8px rgba(20,28,45,.14);
            --rule: rgba(20, 28, 45, .065);
            --margin: rgba(14, 124, 114, .38);
            --change: #d9a400;
            --change-ink: #8a6500;
            --change-bg: rgba(217, 164, 0, .11);
            --del: #e5484d;
            --gutter: clamp(26px, 5vw, 64px);
            --pad-top: 22px;
            --serif: "New York", ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
            --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0f12;
                --sheet: #16191e;
                --tint: #1e2228;
                --line: rgba(255, 255, 255, .09);
                --ink: #e8eaef;
                --muted: #8b93a3;
                --accent: #4fd1c0;
                --accent-ink: #06201c;
                --accent-soft: rgba(79, 209, 192, .15);
                --lift: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -8px rgba(0,0,0,.6);
                --rule: rgba(255, 255, 255, .055);
                --margin: rgba(79, 209, 192, .4);
                --change: #f2c14e;
                --change-ink: #f2c14e;
                --change-bg: rgba(242, 193, 78, .10);
                --del: #ff7a7f;
            }
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--ui);
            font-size: 15px;
            padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        .i {
            width: 20px; height: 20px; flex: none;
            fill: none; stroke: currentColor;
            stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
        }

        /* ---------- Лист ---------- */
        .app {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--sheet);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--lift);
            overflow: hidden;
        }

        /* ---------- Шапка документа ---------- */
        .toolbar {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 12px 20px; padding: 16px 18px 14px;
            border-bottom: 1px solid var(--line);
        }
        .doc { flex: 1 1 240px; min-width: 0; }
        .doc-title {
            display: block;
            font-family: var(--serif); font-size: 1.35rem; font-weight: 600;
            letter-spacing: -.012em; line-height: 1.25; color: var(--ink);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .doc-meta {
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px;
            margin-top: 6px; font-size: .78rem; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        #encodingStatus {
            padding: 2px 9px; border-radius: 999px;
            background: var(--accent-soft); color: var(--accent); font-weight: 600;
        }
        .doc-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .doc-head .doc-title { flex: 0 1 auto; min-width: 0; }
        .state {
            flex: none; display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 999px; font: 600 .74rem var(--ui);
        }
        .state.dirty { background: var(--change-bg); color: var(--change-ink); }
        .state.dirty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--change); }
        .state.ok { background: var(--accent-soft); color: var(--accent); }
        #changeCount { color: var(--change-ink); }
        .tools { display: flex; align-items: center; gap: 10px; }
        .group { display: flex; gap: 2px; padding: 3px; background: var(--tint); border-radius: 12px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 38px; padding: 0 14px; border: 0; border-radius: 10px;
            background: transparent; color: var(--muted);
            font: 500 .88rem var(--ui); white-space: nowrap; cursor: pointer;
            transition: background .15s, color .15s;
        }
        .group .btn { height: 34px; padding: 0 11px; }
        .btn:hover { background: var(--sheet); color: var(--ink); }
        .btn[aria-pressed="true"] { background: var(--sheet); color: var(--accent); box-shadow: 0 0 0 1px var(--line); }
        .btn:focus-visible, .field:focus-visible, select:focus-visible, .chip:focus-within {
            outline: 2px solid var(--accent); outline-offset: 1px;
        }
        .btn-primary { background: var(--accent); color: var(--accent-ink); padding: 0 18px; }
        .btn-primary:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
        .btn-primary:active { transform: translateY(1px); }

        /* ---------- Панели поиска и кодировок ---------- */
        .panel {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--tint);
            border-bottom: 1px solid var(--line);
        }
        .panel.show { display: flex; animation: drop .16s ease-out; }
        @keyframes drop { from { opacity: 0; transform: translateY(-4px); } }

        .field, select {
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--sheet);
            color: var(--ink);
            font: inherit;
            font-size: .9rem;
        }
        .field { flex: 1 1 170px; min-width: 0; }
        .field::placeholder { color: var(--muted); }
        select { padding-right: 6px; cursor: pointer; }

        .panel .btn { background: var(--sheet); border: 1px solid var(--line); color: var(--ink); height: 38px; }
        .panel .btn:hover { border-color: var(--muted); }

        .chip {
            display: inline-flex; align-items: center; gap: 8px;
            height: 38px; padding: 0 12px;
            border: 1px solid var(--line); border-radius: 10px;
            background: var(--sheet);
            font-size: .88rem;
        }
        .chip input { accent-color: var(--accent); margin: 0; }
        .pick { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
        .hint { margin-left: auto; font-size: .82rem; color: var(--muted); }
        .actions { display: flex; flex-wrap: wrap; gap: 6px; }

        /* ---------- Редактор ---------- */
        .editor-container { flex: 1; min-height: 0; display: flex; }
        .editor-wrapper { flex: 1; display: flex; min-width: 0; position: relative; }
        .editor-wrapper::before {
            content: ""; position: absolute; top: 0; bottom: 0;
            left: calc(var(--gutter) - 16px); width: 1px;
            background: var(--margin); pointer-events: none;
        }
        textarea {
            width: 100%; height: 100%; border: 0; outline: 0; resize: none;
            padding: var(--pad-top) var(--gutter);
            position: relative; z-index: 1;
            background: transparent;
            color: var(--ink);
            font-family: var(--mono); font-size: 14.5px; line-height: 26px;
            tab-size: 4; caret-color: var(--accent);
        }
        .marks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .marks > div { position: relative; }
        .chg { position: absolute; left: 0; right: 0; background: var(--change-bg); }
        .chg::before {
            content: ""; position: absolute; top: 0; bottom: 0;
            left: calc(var(--gutter) - 24px); width: 3px; border-radius: 2px; background: var(--change);
        }
        .delmark { position: absolute; left: calc(var(--gutter) - 24px); width: 10px; height: 2px; border-radius: 1px; background: var(--del); }
        .mirror {
            position: absolute; left: 0; top: 0; height: 0; overflow: hidden; visibility: hidden; pointer-events: none;
            padding: var(--pad-top) var(--gutter);
            font-family: var(--mono); font-size: 14.5px; line-height: 26px; tab-size: 4;
            white-space: pre-wrap; overflow-wrap: break-word;
        }
        .mirror div { min-height: 26px; }
        textarea::placeholder { color: var(--muted); opacity: .8; }
        ::selection { background: var(--accent-soft); }

        /* ---------- Подсказка установки ---------- */
        .install-hint {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px 12px 10px 14px;
            background: var(--sheet);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            box-shadow: var(--lift);
            font-size: .85rem;
        }
        .install-hint .i { color: var(--accent); }
        .install-hint b { display: block; font-size: .9rem; }
        .install-hint p { margin: 2px 0 0; color: var(--muted); }
        .install-hint button {
            margin-left: auto; flex: none;
            display: grid; place-items: center;
            width: 32px; height: 32px;
            border: 0; border-radius: 8px;
            background: var(--tint); color: var(--muted); cursor: pointer;
        }

        .hidden-input { display: none; }

        /* ---------- Телефон ---------- */
        @media (max-width: 700px) {
            :root { --gutter: 30px; --pad-top: 16px; }
            body { padding: calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); gap: 6px; }
            .app { border-radius: 16px; }
            .toolbar { padding: 14px 14px 12px; }
            .doc-title { font-size: 1.2rem; }
            .tools { width: 100%; }
            .group { flex: 1; justify-content: space-between; }
            .group .btn { flex: 1; height: 42px; padding: 0; }
            .btn .label { display: none; }
            .btn-primary { height: 42px; }
            .btn-primary .label { display: inline; }
            .panel .btn { height: 40px; padding: 0 12px; }
            .panel .btn .label { display: inline; }
            .field, select, textarea, .mirror { font-size: 16px; }
            .hint { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .panel.show { animation: none; } }
    </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5M6 11H5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1"/></symbol>
</svg>

<div class="install-hint" id="pwa-banner" hidden>
    <svg class="i"><use href="#i-share"/></svg>
    <div>
        <b>Установите приложение</b>
        <p>Нажмите «Поделиться», затем «На экран „Домой“»</p>
    </div>
    <button type="button" id="close-banner-btn" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button>
</div>

<div class="app">
    <div class="toolbar">
        <div class="doc">
            <div class="doc-head">
                <span id="currentFileName" class="doc-title" title="">Без названия</span>
                <span id="dirtyState" class="state" hidden></span>
            </div>
            <div class="doc-meta">
                <span id="encodingStatus" title="Текущая кодировка">UTF-8</span>
                <span id="cursorPosition">Стр 1, Кол 1</span>
                <span id="charCount">0 симв.</span>
                <span id="changeCount" hidden></span>
            </div>
        </div>
        <div class="tools">
            <div class="group">
                <button class="btn" id="openBtn" type="button" title="Открыть файл" aria-label="Открыть файл">
                    <svg class="i"><use href="#i-open"/></svg><span class="label">Открыть</span>
                </button>
                <input type="file" id="fileInput" accept="*/*" class="hidden-input">
                <button class="btn" id="newFileBtn" type="button" title="Новый файл" aria-label="Новый файл">
                    <svg class="i"><use href="#i-new"/></svg><span class="label">Новый</span>
                </button>
                <button class="btn" id="toggleSearchBtn" type="button" title="Поиск и замена (Ctrl+F)" aria-label="Поиск и замена" aria-pressed="false">
                    <svg class="i"><use href="#i-search"/></svg><span class="label">Поиск</span>
                </button>
                <button class="btn" id="toggleEncodingBtn" type="button" title="Кодировка" aria-label="Кодировка" aria-pressed="false">
                    <svg class="i"><use href="#i-text"/></svg><span class="label">Кодировка</span>
                </button>
            </div>
            <button class="btn btn-primary" id="saveBtn" type="button" title="Сохранить (Ctrl+S)" aria-label="Сохранить">
                <svg class="i"><use href="#i-save"/></svg><span class="label">Сохранить</span>
            </button>
        </div>
    </div>

    <div class="panel" id="searchPanel">
        <input type="text" id="searchInput" class="field" placeholder="Найти" autocomplete="off">
        <input type="text" id="replaceInput" class="field" placeholder="Заменить на">
        <div class="actions">
            <button class="btn" id="findBtn" type="button"><span class="label">Найти далее</span></button>
            <button class="btn" id="replaceBtn" type="button"><span class="label">Заменить</span></button>
            <button class="btn" id="replaceAllBtn" type="button"><span class="label">Заменить всё</span></button>
            <label class="chip"><input type="checkbox" id="caseSensitiveCheck"> С учётом регистра</label>
        </div>
    </div>

    <div class="panel" id="encodingPanel">
        <label class="pick">Читать как
            <select id="encodingSelect">
                <option value="auto">Авто</option>
                <option value="utf-8">UTF-8</option>
                <option value="windows-1251">Windows-1251</option>
                <option value="koi8-r">KOI8-R</option>
                <option value="iso-8859-5">ISO-8859-5</option>
                <option value="maccyrillic">MacCyrillic</option>
                <option value="utf-16le">UTF-16 LE</option>
                <option value="utf-16be">UTF-16 BE</option>
            </select>
        </label>
        <label class="pick">Сохранять в
            <select id="saveEncodingSelect">
                <option value="utf-8" selected>UTF-8</option>
                <option value="windows-1251">Windows-1251</option>
                <option value="koi8-r">KOI8-R</option>
                <option value="iso-8859-5">ISO-8859-5</option>
                <option value="maccyrillic">MacCyrillic</option>
                <option value="utf-16le">UTF-16 LE</option>
                <option value="utf-16be">UTF-16 BE</option>
            </select>
        </label>
        <span class="hint" id="encodingHint"></span>
    </div>

    <div class="editor-container">
        <div class="editor-wrapper">
            <textarea id="editor" placeholder="Откройте файл или начните печатать…" spellcheck="false"></textarea>
        </div>
    </div>
</div>

<script>
    // Подсветка несохранённых правок: сравнение с последней сохранённой версией
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var ed = $('editor'), wrap = ed.parentNode, st = $('dirtyState'), cnt = $('changeCount'), cc = $('charCount');
        var base = '', forced = false, flashing = false, tUpd, tFlash, MAX_LINES = 5000;

        var marks = document.createElement('div'), inner = document.createElement('div'), mirror = document.createElement('div');
        marks.className = 'marks'; marks.appendChild(inner);
        mirror.className = 'mirror'; mirror.setAttribute('aria-hidden', 'true');
        wrap.insertBefore(marks, ed); wrap.appendChild(mirror);

        // Построчное сравнение: общие начало и конец отрезаем, середину сверяем по LCS
        function diff(a, b) {
            var s = 0, ea = a.length, eb = b.length, ch = new Set(), del = new Set(), nd = 0;
            while (s < ea && s < eb && a[s] === b[s]) s++;
            while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
            var A = a.slice(s, ea), B = b.slice(s, eb), n = A.length, m = B.length, i, j;
            if (n * m > 2.5e6) {
                for (j = 0; j < m; j++) ch.add(s + j);
                return { ch: ch, del: del, nd: n };
            }
            var w = m + 1, L = new Int32Array((n + 1) * w);
            for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
                L[i * w + j] = A[i] === B[j] ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
            i = 0; j = 0;
            while (i < n && j < m) {
                if (A[i] === B[j]) { i++; j++; }
                else if (L[(i + 1) * w + j] >= L[i * w + j + 1]) { del.add(s + j); nd++; i++; }
                else { ch.add(s + j); j++; }
            }
            while (j < m) { ch.add(s + j); j++; }
            if (i < n) { del.add(s + m); nd += n - i; }
            return { ch: ch, del: del, nd: nd };
        }

        function setState(kind, text) {
            st.hidden = !kind;
            if (kind) { st.className = 'state ' + kind; st.textContent = text; }
        }
        function clearMarks() { inner.textContent = ''; cnt.hidden = true; }
        function rect(cls, top, h) {
            var r = document.createElement('div');
            r.className = cls; r.style.top = top + 'px'; r.style.height = h + 'px';
            return r;
        }

        function update() {
            var cur = ed.value;
            cc.textContent = cur.length.toLocaleString('ru-RU') + ' симв.';
            var dirty = forced || cur !== base;
            if (dirty) { flashing = false; setState('dirty', 'Не сохранено'); }
            else if (!flashing) setState('');
            if (cur === base) return clearMarks();
            var b = cur.split('\n');
            if (b.length > MAX_LINES) return clearMarks();

            var d = diff(base.split('\n'), b);
            // зеркало с теми же шрифтом и шириной даёт высоту каждой строки с учётом переноса
            var frag = document.createDocumentFragment();
            b.forEach(function (t) { var l = document.createElement('div'); l.textContent = t; frag.appendChild(l); });
            mirror.textContent = '';
            mirror.style.width = ed.clientWidth + 'px';
            mirror.appendChild(frag);

            var k = mirror.children, out = document.createDocumentFragment();
            var idx = Array.from(d.ch).sort(function (x, y) { return x - y; });
            for (var i = 0; i < idx.length;) {
                var j = i;
                while (j + 1 < idx.length && idx[j + 1] === idx[j] + 1) j++;
                var top = k[idx[i]].offsetTop, bot = k[idx[j]].offsetTop + k[idx[j]].offsetHeight;
                out.appendChild(rect('chg', top, bot - top));
                i = j + 1;
            }
            d.del.forEach(function (p) {
                if (d.ch.has(p)) return; // заменённая строка уже подсвечена
                var y = p < k.length ? k[p].offsetTop : k[k.length - 1].offsetTop + k[k.length - 1].offsetHeight;
                out.appendChild(rect('delmark', y - 1, 2));
            });
            inner.textContent = '';
            inner.appendChild(out);
            inner.style.transform = 'translateY(' + (-ed.scrollTop) + 'px)';

            var n = Math.max(d.ch.size, d.nd);
            cnt.textContent = 'Изменено строк: ' + n;
            cnt.hidden = n === 0;
        }

        function schedule() { clearTimeout(tUpd); tUpd = setTimeout(update, 120); }

        ed.addEventListener('input', schedule);
        ed.addEventListener('scroll', function () { inner.style.transform = 'translateY(' + (-ed.scrollTop) + 'px)'; });
        if (window.ResizeObserver) new ResizeObserver(schedule).observe(ed);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

        window.NP = {
            reset:    function () { base = ed.value; forced = false; flashing = false; update(); },
            restored: function () { base = ed.value; forced = true; update(); },
            saved:    function () {
                base = ed.value; forced = false; flashing = true;
                setState('ok', 'Сохранено');
                clearTimeout(tFlash); tFlash = setTimeout(function () { flashing = false; update(); }, 2500);
                update();
            },
            touch: schedule,
            _diff: diff
        };
        update();
    })();

    // Кнопка «Открыть» и состояние переключателей панелей
    (function () {
        var fileInput = document.getElementById('fileInput');
        document.getElementById('openBtn').addEventListener('click', function () { fileInput.click(); });
        [['toggleSearchBtn', 'searchPanel'], ['toggleEncodingBtn', 'encodingPanel']].forEach(function (p) {
            var btn = document.getElementById(p[0]), panel = document.getElementById(p[1]);
            var sync = function () { btn.setAttribute('aria-pressed', panel.classList.contains('show')); };
            new MutationObserver(sync).observe(panel, { attributes: true, attributeFilter: ['class'] });
        });
    })();
</script>
<script>
    (function(){
        "use strict";

        // ----- элементы DOM -----
        const fileInput = document.getElementById('fileInput');
        const editor = document.getElementById('editor');
        const encodingSelect = document.getElementById('encodingSelect');
        const saveEncodingSelect = document.getElementById('saveEncodingSelect');
        const saveBtn = document.getElementById('saveBtn');
        const newFileBtn = document.getElementById('newFileBtn');
        const currentFileNameSpan = document.getElementById('currentFileName');
        const encodingStatus = document.getElementById('encodingStatus');
        const encodingHint = document.getElementById('encodingHint');
        const cursorPositionSpan = document.getElementById('cursorPosition');

        const searchPanel = document.getElementById('searchPanel');
        const encodingPanel = document.getElementById('encodingPanel');
        const toggleSearchBtn = document.getElementById('toggleSearchBtn');
        const toggleEncodingBtn = document.getElementById('toggleEncodingBtn');

        const searchInput = document.getElementById('searchInput');
        const replaceInput = document.getElementById('replaceInput');
        const findBtn = document.getElementById('findBtn');
        const replaceBtn = document.getElementById('replaceBtn');
        const replaceAllBtn = document.getElementById('replaceAllBtn');
        const caseSensitiveCheck = document.getElementById('caseSensitiveCheck');

        // ----- состояние -----
        let currentFileBuffer = null;
        let currentFileName = '';
        let originalEncodingUsed = 'utf-8';

        // ----- кодировки (вспомогательные) -----
        function decodeBufferWithEncoding(buffer, encoding) {
            try { return new TextDecoder(encoding.toLowerCase()).decode(buffer); } 
            catch { return null; }
        }

        function autoDetectEncoding(buffer) {
            const arr = new Uint8Array(buffer);
            if (arr.length >= 3 && arr[0] === 0xEF && arr[1] === 0xBB && arr[2] === 0xBF) return 'utf-8';
            if (arr.length >= 2 && arr[0] === 0xFF && arr[1] === 0xFE) return 'utf-16le';
            if (arr.length >= 2 && arr[0] === 0xFE && arr[1] === 0xFF) return 'utf-16be';
            try { new TextDecoder('utf-8', { fatal: true }).decode(buffer); return 'utf-8'; } catch {}
            const candidates = ['windows-1251', 'koi8-r', 'iso-8859-5', 'maccyrillic'];
            for (let enc of candidates) {
                try {
                    const text = new TextDecoder(enc, { fatal: true }).decode(buffer);
                    if (/[а-яА-ЯёЁ]/.test(text)) return enc;
                } catch {}
            }
            return 'windows-1251';
        }

        function loadFileWithEncoding(buffer, encoding) {
            let usedEncoding = encoding === 'auto' ? autoDetectEncoding(buffer) : encoding;
            let text = decodeBufferWithEncoding(buffer, usedEncoding);
            if (text === null) {
                usedEncoding = 'utf-8';
                text = decodeBufferWithEncoding(buffer, 'utf-8') || '';
            }
            editor.value = text; window.NP && NP.reset();
            originalEncodingUsed = usedEncoding;
            encodingStatus.textContent = `${usedEncoding.toUpperCase()}`;
            encodingHint.textContent = `чтение: ${usedEncoding}`;
            if (encodingSelect.value !== usedEncoding && encodingSelect.value !== 'auto') {
                if ([...encodingSelect.options].some(opt => opt.value === usedEncoding))
                    encodingSelect.value = usedEncoding;
            }
        }

        function handleFile(file) {
            if (!file) return;
            currentFileName = file.name;
            currentFileNameSpan.textContent = `${file.name.substring(0,25)}${file.name.length>25?'…':''}`;
            currentFileNameSpan.title = file.name;
            const reader = new FileReader();
            reader.onload = e => {
                currentFileBuffer = e.target.result;
                loadFileWithEncoding(currentFileBuffer, encodingSelect.value);
            };
            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener('change', e => {
            if (fileInput.files[0]) handleFile(fileInput.files[0]);
            fileInput.value = '';
        });

        encodingSelect.addEventListener('change', () => {
            if (currentFileBuffer) loadFileWithEncoding(currentFileBuffer, encodingSelect.value);
        });

        // ----- НОВЫЙ ФАЙЛ (сброс) -----
        function newFile() {
            editor.value = ''; window.NP && NP.reset();
            currentFileBuffer = null;
            currentFileName = '';
            currentFileNameSpan.textContent = 'Без названия';
            currentFileNameSpan.title = '';
            encodingStatus.textContent = 'UTF-8';
            encodingHint.textContent = 'готов';
            originalEncodingUsed = 'utf-8';
            encodingSelect.value = 'auto';
            saveEncodingSelect.value = 'utf-8';
            try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
            updateCursorPos();
        }

        newFileBtn.addEventListener('click', newFile);

        // ----- сохранение -----
        function encodeTextToBuffer(text, encoding) {
            const enc = encoding.toLowerCase();
            if (enc === 'utf-8') return new TextEncoder().encode(text);
            if (enc === 'utf-16le') {
                const buf = new ArrayBuffer(text.length * 2);
                const view = new Uint16Array(buf);
                for (let i=0; i<text.length; i++) view[i] = text.charCodeAt(i);
                return new Uint8Array(buf);
            }
            if (enc === 'utf-16be') {
                const buf = new ArrayBuffer(text.length * 2);
                const view = new Uint8Array(buf);
                for (let i=0; i<text.length; i++) {
                    const code = text.charCodeAt(i);
                    view[i*2] = (code>>8)&0xFF;
                    view[i*2+1] = code&0xFF;
                }
                return view;
            }
            if (enc === 'windows-1251') return encodeWindows1251(text);
            if (enc === 'koi8-r') return encodeKoi8r(text);
            if (enc === 'iso-8859-5') return encodeIso8859_5(text);
            if (enc === 'maccyrillic') return encodeMacCyrillic(text);
            return new TextEncoder().encode(text);
        }

        function encodeWindows1251(str){ const bytes=[]; for(let ch of str){const cp=ch.charCodeAt(0); if(cp<0x80)bytes.push(cp); else if(cp===0x0401)bytes.push(0xA8); else if(cp===0x0451)bytes.push(0xB8); else if(cp>=0x0410&&cp<=0x044F){if(cp<=0x041F)bytes.push(cp-0x0410+0xC0);else if(cp<=0x042F)bytes.push(cp-0x0420+0xD0);else if(cp<=0x043F)bytes.push(cp-0x0430+0xE0);else bytes.push(cp-0x0440+0xF0);}else bytes.push(0x3F);} return new Uint8Array(bytes); }
        function encodeKoi8r(str){ const map={'Ё':0xB3,'ё':0xA3,'А':0xE1,'Б':0xE2,'В':0xF7,'Г':0xE7,'Д':0xE4,'Е':0xE5,'Ж':0xF6,'З':0xFA,'И':0xE9,'Й':0xEA,'К':0xEB,'Л':0xEC,'М':0xED,'Н':0xEE,'О':0xEF,'П':0xF0,'Р':0xF2,'С':0xF3,'Т':0xF4,'У':0xF5,'Ф':0xE6,'Х':0xE8,'Ц':0xE3,'Ч':0xFE,'Ш':0xFB,'Щ':0xFD,'Ъ':0xFF,'Ы':0xF9,'Ь':0xF8,'Э':0xFC,'Ю':0xE0,'Я':0xF1,'а':0xC1,'б':0xC2,'в':0xD7,'г':0xC7,'д':0xC4,'е':0xC5,'ж':0xD6,'з':0xDA,'и':0xC9,'й':0xCA,'к':0xCB,'л':0xCC,'м':0xCD,'н':0xCE,'о':0xCF,'п':0xD0,'р':0xD2,'с':0xD3,'т':0xD4,'у':0xD5,'ф':0xC6,'х':0xC8,'ц':0xC3,'ч':0xDE,'ш':0xDB,'щ':0xDD,'ъ':0xDF,'ы':0xD9,'ь':0xD8,'э':0xDC,'ю':0xC0,'я':0xD1}; const bytes=[]; for(let ch of str) bytes.push(map[ch]??(ch.charCodeAt(0)<0x80?ch.charCodeAt(0):0x3F)); return new Uint8Array(bytes); }
        function encodeIso8859_5(str){ const bytes=[]; for(let ch of str){const cp=ch.charCodeAt(0); if(cp<0x80)bytes.push(cp); else if(cp===0x0401)bytes.push(0xA1); else if(cp===0x0451)bytes.push(0xF1); else if(cp>=0x0410&&cp<=0x044F)bytes.push(cp-0x0410+0xB0); else bytes.push(0x3F);} return new Uint8Array(bytes); }
        function encodeMacCyrillic(str){ const map={'А':0x80,'Б':0x81,'В':0x82,'Г':0x83,'Д':0x84,'Е':0x85,'Ж':0x86,'З':0x87,'И':0x88,'Й':0x89,'К':0x8A,'Л':0x8B,'М':0x8C,'Н':0x8D,'О':0x8E,'П':0x8F,'Р':0x90,'С':0x91,'Т':0x92,'У':0x93,'Ф':0x94,'Х':0x95,'Ц':0x96,'Ч':0x97,'Ш':0x98,'Щ':0x99,'Ъ':0x9A,'Ы':0x9B,'Ь':0x9C,'Э':0x9D,'Ю':0x9E,'Я':0x9F,'а':0xE0,'б':0xE1,'в':0xE2,'г':0xE3,'д':0xE4,'е':0xE5,'ж':0xE6,'з':0xE7,'и':0xE8,'й':0xE9,'к':0xEA,'л':0xEB,'м':0xEC,'н':0xED,'о':0xEE,'п':0xEF,'р':0xF0,'с':0xF1,'т':0xF2,'у':0xF3,'ф':0xF4,'х':0xF5,'ц':0xF6,'ч':0xF7,'ш':0xF8,'щ':0xF9,'ъ':0xFA,'ы':0xFB,'ь':0xFC,'э':0xFD,'ю':0xFE,'я':0xFF,'Ё':0xDD,'ё':0xDE}; const bytes=[]; for(let ch of str) bytes.push(map[ch]??(ch.charCodeAt(0)<0x80?ch.charCodeAt(0):0x3F)); return new Uint8Array(bytes); }

        function doSave() {
            const text = editor.value;
            const encoding = saveEncodingSelect.value;
            const bytes = encodeTextToBuffer(text, encoding);
            let suggested = currentFileName || 'документ.txt';
            const newName = prompt('Имя файла для сохранения:', suggested);
            if (newName === null) return;
            const finalName = newName.trim() || 'документ.txt';
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = finalName;
            a.click();
            URL.revokeObjectURL(url);
            window.NP && NP.saved();
            encodingStatus.textContent = `${encoding.toUpperCase()} (сохр.)`;
        }

        saveBtn.addEventListener('click', doSave);

        // ----- поиск / замена (исправлен) -----
        function findNext(forward = true) {
            const searchStr = searchInput.value;
            if (!searchStr) return false;
            const content = editor.value;
            const caseSensitive = caseSensitiveCheck.checked;
            const searchContent = caseSensitive ? content : content.toLowerCase();
            const searchFor = caseSensitive ? searchStr : searchStr.toLowerCase();
            
            let start = editor.selectionStart;
            const selected = content.substring(editor.selectionStart, editor.selectionEnd);
            const matches = caseSensitive ? selected === searchStr : selected.toLowerCase() === searchFor;
            if (matches) start = editor.selectionEnd;
            
            let found = searchContent.indexOf(searchFor, start);
            if (found === -1 && start > 0) found = searchContent.indexOf(searchFor, 0);
            if (found !== -1) {
                editor.focus();
                editor.setSelectionRange(found, found + searchStr.length);
                const linesBefore = content.substring(0, found).split('\n').length;
                editor.scrollTop = (linesBefore-1) * 21;
                return true;
            }
            return false;
        }

        findBtn.addEventListener('click', () => {
            if (!findNext(true)) alert('Ничего не найдено');
        });

        replaceBtn.addEventListener('click', () => {
            const searchStr = searchInput.value;
            if (!searchStr) return;
            const selection = editor.value.substring(editor.selectionStart, editor.selectionEnd);
            const caseSensitive = caseSensitiveCheck.checked;
            const match = caseSensitive ? selection === searchStr : selection.toLowerCase() === searchStr.toLowerCase();
            if (match) {
                editor.setRangeText(replaceInput.value, editor.selectionStart, editor.selectionEnd, 'end'); window.NP && NP.touch();
            }
            findNext(true);
        });

        replaceAllBtn.addEventListener('click', () => {
            const searchStr = searchInput.value;
            if (!searchStr) return;
            const replaceStr = replaceInput.value;
            const caseSensitive = caseSensitiveCheck.checked;
            const flags = caseSensitive ? 'g' : 'gi';
            const escaped = searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped, flags);
            editor.value = editor.value.replace(regex, replaceStr); window.NP && NP.touch();
        });

        // ----- позиция курсора -----
        function updateCursorPos() {
            const pos = editor.selectionStart;
            const text = editor.value;
            const lines = text.substr(0, pos).split('\n');
            const line = lines.length;
            const col = lines[lines.length-1].length + 1;
            cursorPositionSpan.textContent = `Стр ${line}, Кол ${col}`;
        }
        editor.addEventListener('click', updateCursorPos);
        editor.addEventListener('keyup', updateCursorPos);
        editor.addEventListener('mouseup', updateCursorPos);
        editor.addEventListener('input', updateCursorPos);

        // ----- управление панелями -----
        toggleSearchBtn.addEventListener('click', () => {
            searchPanel.classList.toggle('show');
            encodingPanel.classList.remove('show');
        });
        toggleEncodingBtn.addEventListener('click', () => {
            encodingPanel.classList.toggle('show');
            searchPanel.classList.remove('show');
        });

        // Drag & drop
        const editorContainer = document.querySelector('.editor-container');
        editorContainer.addEventListener('dragover', e => e.preventDefault());
        editorContainer.addEventListener('drop', e => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // Горячие клавиши
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                doSave();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchPanel.classList.add('show');
                encodingPanel.classList.remove('show');
                searchInput.focus();
            }
        });

        // ----- локальный черновик (автосохранение) -----
        const DRAFT_KEY = 'notepad5-draft-v1';
        let draftTimer = null;
        function saveDraft() {
            clearTimeout(draftTimer);
            draftTimer = setTimeout(() => {
                try {
                    if (editor.value) localStorage.setItem(DRAFT_KEY, editor.value);
                    else localStorage.removeItem(DRAFT_KEY);
                } catch (e) {}
            }, 400);
        }
        function restoreDraft() {
            try {
                const draft = localStorage.getItem(DRAFT_KEY);
                if (draft) {
                    editor.value = draft; window.NP && NP.restored();
                    currentFileNameSpan.textContent = 'Черновик';
                    currentFileNameSpan.title = 'Локальный черновик (автосохранение)';
                }
            } catch (e) {}
        }
        editor.addEventListener('input', saveDraft);

        // ----- подсказка установки (iOS) -----
        const pwaBanner = document.getElementById('pwa-banner');
        const closeBannerBtn = document.getElementById('close-banner-btn');
        const BANNER_CLOSED_KEY = 'pwaBannerClosed';

        function applyBannerVisibility() {
            const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
            const standalone = window.navigator.standalone === true;
            const inStandalone = window.matchMedia('(display-mode: standalone)').matches;
            let closed = false;
            try { closed = localStorage.getItem(BANNER_CLOSED_KEY) === 'true'; } catch (e) {}
            const shouldShow = isIOS && !standalone && !inStandalone && !closed;
            pwaBanner.hidden = !shouldShow;
            pwaBanner.style.display = shouldShow ? 'flex' : 'none';
        }

        closeBannerBtn.addEventListener('click', function () {
            pwaBanner.hidden = true;
            pwaBanner.style.display = 'none';
            try { localStorage.setItem(BANNER_CLOSED_KEY, 'true'); } catch (e) {}
        });

        applyBannerVisibility();

        // ----- регистрация service worker (оффлайн) -----
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        // Инициализация
        encodingStatus.textContent = 'UTF-8';
        encodingHint.textContent = 'готов';
        restoreDraft();
        updateCursorPos();
    })();
</script>
